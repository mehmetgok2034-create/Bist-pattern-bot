name: BIST Günlük Grafik Formasyonu

on:
  schedule:
    - cron: "15 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install requests numpy pandas scipy matplotlib mplfinance yfinance

      - name: Formasyon taraması ve Telegram bildirimi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_chart_patterns.py

      - name: Durum dosyasını commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sent_daily_patterns.json
          git diff --staged --quiet || git commit -m "Günlük formasyon durumunu güncelle"
          git push
